{% extends "base.html" %}
{% block title %}Edit {{ product.code }}{% endblock %}
{% block content %}
<header class="page-header"><div><div class="eyebrow">Inventory</div><h1 class="page-title">Update {{ product.code }}.</h1><p class="page-subtitle">Keep the price and available stock current so new orders stay accurate.</p></div><a href="/inventory" class="btn btn-outline"><i class="icon icon-arrow-left" aria-hidden="true"></i> Back to inventory</a></header>
<section class="card" style="max-width:760px"><form action="/inventory/edit/{{ product.id }}" method="POST" novalidate data-validate="product" data-existing-codes="{{ existing_codes | join(',') }}"><div class="form-row"><div class="form-group"><label class="form-label" for="code">Product code *</label><input type="text" id="code" name="code" class="form-control" value="{{ product.code }}" required maxlength="20" style="text-transform:uppercase;font-weight:800"></div><div class="form-group"><label class="form-label" for="name">Product name *</label><input type="text" id="name" name="name" class="form-control" value="{{ product.name }}" required minlength="2" maxlength="120"></div></div><div class="form-row"><div class="form-group"><label class="form-label" for="cost_price">Cost price *</label><input type="number" step="any" id="cost_price" name="cost_price" class="form-control" value="{{ product.cost_price }}" required min="0" inputmode="decimal"></div><div class="form-group"><label class="form-label" for="selling_price">Selling price *</label><input type="number" step="any" id="selling_price" name="selling_price" class="form-control" value="{{ product.selling_price }}" required min="0" inputmode="decimal"></div><div class="form-group"><label class="form-label" for="stock">Units in stock *</label><input type="number" id="stock" name="stock" class="form-control" value="{{ product.stock }}" min="0" max="1000000" step="1" required inputmode="numeric"></div></div><div style="display:flex;justify-content:flex-end;gap:.6rem;margin-top:.5rem"><a href="/inventory" class="btn btn-outline">Cancel</a><button type="submit" class="btn btn-primary"><i class="icon icon-check" aria-hidden="true"></i> Save changes</button></div></form></section>
{% endblock %}
